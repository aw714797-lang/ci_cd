name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: # Manual trigger

env:
  NODE_VERSION: '24.x'
  APP_NAME: 'vanilla-app'

jobs:
  build-and-test:
    name: 'quality'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Syntax
        run: |
          npm install -g htmlhint
          htmlhint *.html

name: Deploy Locally to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

  steps:   
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Copy HTML files to Web Directory
      run: |
        sudo cp -r ./* /var/www/html
       
    - name: Verify Deployment
      run: |
        echo "Deployment complete. Checking Nginx status .."
        sudo systemctl is-active nginx    
