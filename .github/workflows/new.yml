name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: # Manual trigger

env:
  NODE_VERSION: '24.x'
  APP_NAME: 'vanilla-app'

jobs:
  build-and-test:
    name: 'quality'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
